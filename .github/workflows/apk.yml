name: Publicar APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar o keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/teletv.jks"

      - name: Build de release
        env:
          # O app só se atualiza por cima se todo release sair com a mesma assinatura.
          KEYSTORE_FILE: ${{ runner.temp }}/teletv.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: ./gradlew assembleRelease --console=plain

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk "teletv-${GITHUB_REF_NAME}.apk"

      - name: Criar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "TeleTV $GITHUB_REF_NAME" \
            --generate-notes \
            "teletv-${GITHUB_REF_NAME}.apk"
